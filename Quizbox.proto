syntax = "proto3";

import "DeviceInfo.proto";
option csharp_namespace = "QuizboxUI.Protos";

// package quizbox;
enum Type {
  TIMER_EXPIRED     = 0;
  QUIZZER_ACTION     = 1;
  BUTTON_ACTION     = 2;
  TIMER_STARTED     = 3;
  TIMER_CLEARED     = 4;
  QUIZZER_CLEARED    = 5;
  QUIZZER_DISPLAYED  = 6;
  QUIZZER_ACTIVE     = 7;
  TIMER_COUNTDOWN   = 8;
  QUIZZERS_LIT_UP    = 9;
  PAIRING_ACTIVE    = 10;
  PAIRING_INACTIVE  = 11;
  END               = 12;
  QUIZZER_ARBITRATION_EXPIRED = 13;
}

enum ButtonID {
  TIMER_530    = 0;
  TIMER_RESET  = 1;
  QUIZZER_RESET = 2;
  TIMER_60     = 3;
  TIMER_120    = 4;
  CONTEST      = 5;
  ENDER        = 6;
}

message QuizzerEvent {
  uint32 quizzer_id = 1;
  bool is_pressed = 2;
  uint64 timestamp_us = 3;
  bool timestamp_valid = 4;
  bool timestamp_stale = 5;
}

message ButtonEvent {
  ButtonID button_id = 1;
  bool is_pressed = 2;
}

message TimerEvent {
  int32 seconds_remaining = 1;
}

message ActiveQuizzers {
  bool is_active = 1;
  repeated uint32 active_quizzers = 2;
}

message EventMessage {
  Type type = 1;
  oneof event_data {
    QuizzerEvent quizzer_event = 2;
    ButtonEvent button_event = 3;
    TimerEvent timer_event = 4;
    ActiveQuizzers active_quizzers = 6;
  }
  uint64 timestamp_us = 5; // Microseconds timestamp
}

message QuizboxMessage {
  oneof message {
    EventMessage event = 1;
    DeviceInfo device_info = 2;
  }
}
