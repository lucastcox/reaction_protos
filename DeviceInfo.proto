syntax = "proto3";
option csharp_namespace = "QuizboxUI.Protos";
message DeviceInfo {
  enum DEVICE_TYPE {
    Main             = 0;
    Coprocessor      = 1;
    
  }

  enum BOARD_REV {
    Rev1 = 0;
    Rev2 = 1;
  }

   string      bootloaderVersion = 1;
   string      firmwareVersion   = 2;  
   string      idfVersion        = 3;
   string      macAddress        = 4;
   BOARD_REV   boardRevision     = 5;  
   string      bankId            = 6;
   DEVICE_TYPE deviceType        = 7;
}
